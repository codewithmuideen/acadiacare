<!DOCTYPE html>
<html lang="en-GB" data-page="admin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Acadia Care</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/editor.css">
<link rel="stylesheet" href="/src/css/admin.css">
</head>
<body class="ad">
  <!-- Sign in -->
  <section class="ad-auth" id="authView" hidden>
    <div class="ad-auth-card">
      <a href="/" class="ad-logo" aria-label="Back to website"><!-- @include logo --></a>
      <h1 id="authTitle">Admin sign in</h1>
      <p class="ae-muted" id="authSub">Sign in to edit the website and view applications.</p>
      <form id="loginForm" class="ad-form">
        <label class="ae-field"><span>Email</span><input type="email" name="email" required autocomplete="username"></label>
        <label class="ae-field"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
        <div class="ad-msg" role="status" aria-live="polite"></div>
        <button class="ae-btn ae-btn-primary ad-wide" type="submit">Sign in</button>
        <button class="ad-link" type="button" id="forgotBtn">Forgot password?</button>
      </form>
      <form id="resetForm" class="ad-form" hidden>
        <label class="ae-field"><span>New password (min 10 characters)</span><input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
        <label class="ae-field"><span>Confirm new password</span><input type="password" name="confirm" required minlength="10" autocomplete="new-password"></label>
        <div class="ad-msg" role="status" aria-live="polite"></div>
        <button class="ae-btn ae-btn-primary ad-wide" type="submit">Set password</button>
      </form>
      <a href="/" class="ad-link">&larr; Back to website</a>
    </div>
  </section>

  <!-- Dashboard -->
  <div class="ad-app" id="appView" hidden>
    <aside class="ad-side">
      <a href="/" class="ad-logo" aria-label="View website"><!-- @include logo --></a>
      <nav class="ad-tabs" id="tabs">
        <button data-tab="overview" class="on"><i data-lucide="layout-dashboard"></i> Overview</button>
        <button data-tab="pages"><i data-lucide="pencil-ruler"></i> Edit website</button>
        <button data-tab="applications"><i data-lucide="file-user"></i> Applications <b class="ad-count" data-count="applications"></b></button>
        <button data-tab="enquiries"><i data-lucide="inbox"></i> Enquiries <b class="ad-count" data-count="enquiries"></b></button>
        <button data-tab="menu"><i data-lucide="menu"></i> Menu</button>
        <button data-tab="settings"><i data-lucide="settings"></i> Site settings</button>
        <button data-tab="custom"><i data-lucide="file-plus-2"></i> Custom pages</button>
        <button data-tab="media"><i data-lucide="images"></i> Media library</button>
        <button data-tab="account"><i data-lucide="user-cog"></i> Account</button>
      </nav>
      <div class="ad-side-foot"><span id="whoami" class="ae-muted"></span><button class="ae-btn" id="logoutBtn"><i data-lucide="log-out"></i> Sign out</button></div>
    </aside>
    <main class="ad-main" id="panel" tabindex="-1"></main>
  </div>

  <div class="ad-loading" id="loadingView"><span class="ad-spin"></span></div>
  <script type="module" src="/src/js/admin.js"></script>
</body>
</html>
