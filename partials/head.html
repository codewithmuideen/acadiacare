<script>
  /* Hide editable regions very briefly while live CMS content loads (never longer than 1.2s). */
  (function () {
    var d = document.documentElement; d.classList.add('js');
    try {
      if ('%VITE_SUPABASE_URL%'.indexOf('http') !== 0) return;
      if (!localStorage.getItem('acadia-cms-v1')) { d.classList.add('cms-pending'); setTimeout(function () { d.classList.remove('cms-pending') }, 1200) }
    } catch (e) {}
  })();
</script>
